[project]
name = "sdr-cockpit-backend"
version = "0.1.0"
description = "SDR Cockpit Backend API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "python-multipart>=0.0.20",
    "numpy>=2.0",
    "protobuf>=6.31,<8.0",
    "grpcio-tools>=1.76",
    "zstandard>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "httpx-ws>=0.7",
    "black>=25.9",
    "ruff>=0.14",
    "mypy>=1.18",
    "datamodel-code-generator[http]>=0.26",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | proto
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
