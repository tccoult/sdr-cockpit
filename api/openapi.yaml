# SDR Cockpit OpenAPI Specification
# Source of truth for API contract
# Auto-generate TypeScript and Python types from this file
#
# To regenerate types:
#   Frontend: npm run generate:types
#   Backend: ./scripts/generate-models.sh

openapi: 3.1.0
info:
  title: SDR Cockpit API
  description: Software Defined Radio Web Application API
  version: 0.1.0
# === API Endpoints ===
paths:
  /api/tasks/:
    get:
      tags:
      - tasks
      summary: List Tasks
      description: List all tasks
      operationId: list_tasks_tasks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Task'
                type: array
    post:
      tags:
      - tasks
      summary: Create Task
      description: Create a new task
      operationId: create_task_tasks
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateRxTaskParams'
              - $ref: '#/components/schemas/CreateTxTaskParams'
              title: Params
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}:
    get:
      tags:
      - tasks
      summary: Get Task
      description: Get a single task by ID
      operationId: get_task_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - tasks
      summary: Update Task
      description: Update a task
      operationId: update_task_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskParams'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - tasks
      summary: Delete Task
      description: Delete a task
      operationId: delete_task_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/pause:
    post:
      tags:
      - tasks
      summary: Pause Task
      description: Pause a task
      operationId: pause_task_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/resume:
    post:
      tags:
      - tasks
      summary: Resume Task
      description: Resume a paused task
      operationId: resume_task_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}/record:
    post:
      tags:
      - tasks
      summary: Start Recording
      description: Start recording on an RX task
      operationId: start_recording_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - tasks
      summary: Stop Recording
      description: Stop recording on a task
      operationId: stop_recording_tasks
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sources/:
    get:
      tags:
      - sources
      summary: List Sources
      description: List all available data sources
      operationId: list_sources
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
  /api/health/bit/results:
    get:
      tags:
      - health
      summary: Get Bit Results
      description: Get latest BIT test results with function and hardware trees
      operationId: get_bit_results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitResult'
  /api/health/bit/alerts:
    get:
      tags:
      - health
      summary: Get Bit Alerts
      description: Get recent BIT alerts with optional filtering
      operationId: get_bit_alerts
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: integer
          title: Since
          description: Unix timestamp in ms (default 4 hours ago)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitAlertList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/health/bit/metrics:
    get:
      tags:
      - health
      summary: Get Bit Metrics
      description: Get health metrics over a time window
      operationId: get_bit_metrics
      parameters:
      - name: window_minutes
        in: query
        required: false
        schema:
          type: integer
          default: 240
          title: Window Minutes
          description: Time window in minutes (default 4 hours)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitHealthMetrics'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/health/bit/history:
    get:
      tags:
      - health
      summary: Get Bit Test History
      description: Get status history for a specific test
      operationId: get_bit_history
      parameters:
      - name: test_id
        in: query
        required: true
        schema:
          type: string
          title: Test Id
      - name: since
        in: query
        required: false
        schema:
          type: integer
          title: Since
          description: Unix timestamp in ms
      - name: until
        in: query
        required: false
        schema:
          type: integer
          title: Until
          description: Unix timestamp in ms
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitTestHistory'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/system/update/lock:
    post:
      tags:
      - system-update
      summary: Acquire Lock
      description: Acquire exclusive lock for system update
      operationId: acquire_lock_system
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockAcquireResponse'
    get:
      tags:
      - system-update
      summary: Get Lock Status
      description: Get current lock status
      operationId: get_lock_status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockStatusResponse'
    delete:
      tags:
      - system-update
      summary: Release Lock
      description: Release the system update lock
      operationId: release_lock_system
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/system/update/upload:
    post:
      tags:
      - system-update
      summary: Upload Package
      description: Upload system update package with streaming
      operationId: upload_package_system
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_package_api_system_update_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/system/update/upload-status/{upload_id}:
    get:
      tags:
      - system-update
      summary: Get Upload Status
      description: Get upload and validation status
      operationId: get_upload_status
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          title: Upload Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/system/update/install:
    post:
      tags:
      - system-update
      summary: Start Installation
      description: Start installation process
      operationId: start_installation_system
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/system/update/install-status/{install_id}:
    get:
      tags:
      - system-update
      summary: Get Install Status
      description: Get installation progress
      operationId: get_install_status
      parameters:
      - name: install_id
        in: path
        required: true
        schema:
          type: string
          title: Install Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ws/active:
    get:
      summary: Get Active Connections
      description: Debug endpoint to see active WebSocket connections
      operationId: get_active_connections
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/:
    get:
      summary: Root
      description: Root API endpoint
      operationId: root
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/healthcheck:
    get:
      summary: Healthcheck
      description: Health check endpoint
      operationId: healthcheck_healthcheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}

# === Data Models ===
# Schemas are organized into domain-specific files under ./schemas/
components:
  schemas:
    # Task-related schemas
    Task:
      $ref: './schemas/tasks.yaml#/Task'
    TaskOwner:
      $ref: './schemas/tasks.yaml#/TaskOwner'
    TaskStatus:
      $ref: './schemas/tasks.yaml#/TaskStatus'
    TaskType:
      $ref: './schemas/tasks.yaml#/TaskType'
    CreateRxTaskParams:
      $ref: './schemas/tasks.yaml#/CreateRxTaskParams'
    CreateTxTaskParams:
      $ref: './schemas/tasks.yaml#/CreateTxTaskParams'
    UpdateTaskParams:
      $ref: './schemas/tasks.yaml#/UpdateTaskParams'
    RecordingInfo:
      $ref: './schemas/tasks.yaml#/RecordingInfo'
    PlaybackInfo:
      $ref: './schemas/tasks.yaml#/PlaybackInfo'
    VisualizationMode:
      $ref: './schemas/tasks.yaml#/VisualizationMode'

    # Source-related schemas
    DataSource:
      $ref: './schemas/sources.yaml#/DataSource'

    # Health/BIT-related schemas
    BitMetrics:
      $ref: './schemas/health.yaml#/BitMetrics'
    BitResult:
      $ref: './schemas/health.yaml#/BitResult'
    BitStatus:
      $ref: './schemas/health.yaml#/BitStatus'
    BitSummary:
      $ref: './schemas/health.yaml#/BitSummary'
    BitTest:
      $ref: './schemas/health.yaml#/BitTest'
    BitTreeNode:
      $ref: './schemas/health.yaml#/BitTreeNode'
    BitAlert:
      $ref: './schemas/health.yaml#/BitAlert'
    BitAlertSeverity:
      $ref: './schemas/health.yaml#/BitAlertSeverity'
    BitAlertList:
      $ref: './schemas/health.yaml#/BitAlertList'
    BitHealthMetrics:
      $ref: './schemas/health.yaml#/BitHealthMetrics'
    TestFailureCount:
      $ref: './schemas/health.yaml#/TestFailureCount'
    BitTestHistoryPoint:
      $ref: './schemas/health.yaml#/BitTestHistoryPoint'
    BitTestHistory:
      $ref: './schemas/health.yaml#/BitTestHistory'
    # System update-related schemas
    UpdateStatus:
      $ref: './schemas/update.yaml#/UpdateStatus'
    LockAcquireResponse:
      $ref: './schemas/update.yaml#/LockAcquireResponse'
    LockStatusResponse:
      $ref: './schemas/update.yaml#/LockStatusResponse'
    InstallStartRequest:
      $ref: './schemas/update.yaml#/InstallStartRequest'
    InstallStartResponse:
      $ref: './schemas/update.yaml#/InstallStartResponse'
    InstallStatusResponse:
      $ref: './schemas/update.yaml#/InstallStatusResponse'
    UploadStatusResponse:
      $ref: './schemas/update.yaml#/UploadStatusResponse'
    Body_upload_package_api_system_update_upload_post:
      $ref: './schemas/update.yaml#/Body_upload_package_api_system_update_upload_post'

    # Common schemas
    HTTPValidationError:
      $ref: './schemas/common.yaml#/HTTPValidationError'
    ValidationError:
      $ref: './schemas/common.yaml#/ValidationError'
