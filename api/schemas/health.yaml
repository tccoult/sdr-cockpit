# Health/BIT-related schemas
# Auto-generate TypeScript and Python types from this file

BitAlert:
  type: object
  required:
  - id
  - timestamp
  - testId
  - testName
  - newStatus
  - severity
  - message
  properties:
    id:
      type: integer
      title: Id
    timestamp:
      type: integer
      title: Timestamp
      description: Unix timestamp in ms
    testId:
      type: string
      title: TestId
    testName:
      type: string
      title: TestName
    previousStatus:
      anyOf:
      - $ref: '#/BitStatus'
      - type: 'null'
    newStatus:
      $ref: '#/BitStatus'
    severity:
      $ref: '#/BitAlertSeverity'
    message:
      type: string
      title: Message
  title: BitAlert
  description: Alert generated from BIT status transitions

BitAlertSeverity:
  type: string
  enum:
  - failed
  - degraded
  - recovered
  title: BitAlertSeverity
  description: Severity level of a BIT alert

BitAlertList:
  type: object
  required:
  - alerts
  - totalCount
  properties:
    alerts:
      type: array
      items:
        $ref: '#/BitAlert'
      title: Alerts
    totalCount:
      type: integer
      title: TotalCount
  title: BitAlertList
  description: List of BIT alerts with counts

BitHealthMetrics:
  type: object
  required:
  - windowMinutes
  - snapshotCount
  - operationalPercent
  - degradedMinutes
  - nonOpMinutes
  - failureCount
  - topFailingTests
  properties:
    windowMinutes:
      type: integer
      title: WindowMinutes
    snapshotCount:
      type: integer
      title: SnapshotCount
    operationalPercent:
      type: number
      title: OperationalPercent
    degradedMinutes:
      type: number
      title: DegradedMinutes
    nonOpMinutes:
      type: number
      title: NonOpMinutes
    failureCount:
      type: integer
      title: FailureCount
    topFailingTests:
      type: array
      items:
        $ref: '#/TestFailureCount'
      title: TopFailingTests
  title: BitHealthMetrics
  description: Health metrics over a time window

TestFailureCount:
  type: object
  required:
  - testId
  - testName
  - failMinutes
  properties:
    testId:
      type: string
      title: TestId
    testName:
      type: string
      title: TestName
    failMinutes:
      type: number
      title: FailMinutes
  title: TestFailureCount
  description: Time-weighted failure duration (minutes) for a specific test

BitTestHistoryPoint:
  type: object
  required:
  - timestamp
  - status
  properties:
    timestamp:
      type: integer
      title: Timestamp
      description: Unix timestamp in ms
    status:
      $ref: '#/BitStatus'
    durationMs:
      anyOf:
      - type: integer
      - type: 'null'
      title: DurationMs
  title: BitTestHistoryPoint
  description: Single point in test history

BitTestHistory:
  type: object
  required:
  - testId
  - testName
  - points
  properties:
    testId:
      type: string
      title: TestId
    testName:
      type: string
      title: TestName
    points:
      type: array
      items:
        $ref: '#/BitTestHistoryPoint'
      title: Points
  title: BitTestHistory
  description: Status history for a specific test

BitMetrics:
  properties:
    expected:
      anyOf:
      - type: string
      - type: 'null'
      title: Expected
    actual:
      anyOf:
      - type: string
      - type: 'null'
      title: Actual
    threshold:
      anyOf:
      - type: string
      - type: 'null'
      title: Threshold
    unit:
      anyOf:
      - type: string
      - type: 'null'
      title: Unit
  type: object
  title: BitMetrics
  description: Metrics for a BIT test result

BitResult:
  properties:
    timestamp:
      type: integer
      title: Timestamp
      description: Unix timestamp in ms
    overallStatus:
      $ref: '#/BitStatus'
      description: Overall system status derived from function tree rollup
    summary:
      $ref: '#/BitSummary'
    tests:
      items:
        $ref: '#/BitTest'
      type: array
      title: Tests
    functionTree:
      $ref: '#/BitTreeNode'
    hardwareTree:
      $ref: '#/BitTreeNode'
  type: object
  required:
  - timestamp
  - overallStatus
  - summary
  - tests
  - functionTree
  - hardwareTree
  title: BitResult
  description: BIT test suite result

BitStatus:
  type: string
  enum:
  - ok
  - warn
  - fail
  - unknown
  title: BitStatus
  description: Built-In Test (BIT) status values

BitSummary:
  properties:
    total:
      type: integer
      title: Total
    ok:
      type: integer
      title: Ok
    warn:
      type: integer
      title: Warn
    fail:
      type: integer
      title: Fail
  type: object
  required:
  - total
  - ok
  - warn
  - fail
  title: BitSummary
  description: Summary counts for BIT test results

BitTest:
  properties:
    id:
      type: string
      title: Id
    name:
      type: string
      title: Name
    status:
      $ref: '#/BitStatus'
    description:
      anyOf:
      - type: string
      - type: 'null'
      title: Description
    lastRun:
      anyOf:
      - type: integer
      - type: 'null'
      title: Lastrun
      description: Unix timestamp in ms
    durationMs:
      anyOf:
      - type: integer
      - type: 'null'
      title: Durationms
      description: Duration in milliseconds
    metrics:
      anyOf:
      - $ref: '#/BitMetrics'
      - type: 'null'
    functionNodes:
      items:
        type: string
      type: array
      title: Functionnodes
      description: Function node IDs
    hardwareNodes:
      items:
        type: string
      type: array
      title: Hardwarenodes
      description: Hardware node IDs
  type: object
  required:
  - id
  - name
  - status
  title: BitTest
  description: Atomic BIT test definition with rollup mappings

BitTreeNode:
  properties:
    id:
      type: string
      title: Id
    name:
      type: string
      title: Name
    status:
      $ref: '#/BitStatus'
    description:
      anyOf:
      - type: string
      - type: 'null'
      title: Description
    children:
      anyOf:
      - items:
          $ref: '#/BitTreeNode'
        type: array
      - type: 'null'
      title: Children
    tests:
      anyOf:
      - items:
          type: string
        type: array
      - type: 'null'
      title: Tests
      description: IDs of tests mapped to this node
  type: object
  required:
  - id
  - name
  - status
  title: BitTreeNode
  description: Rollup node used by functional and hardware hierarchies
