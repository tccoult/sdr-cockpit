name: CI/CD

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend checks
        run: ./scripts/check-frontend.sh

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run backend checks
        run: ./scripts/check-backend.sh

  simulator-checks:
    name: Simulator Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "simulator/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd simulator
          uv sync --frozen

      - name: Run simulator checks
        run: ./scripts/check-simulator.sh

  generate-api-docs:
    name: Generate API Documentation
    needs: [frontend-checks, backend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate OpenAPI HTML documentation
        run: ./scripts/generate-docs.sh

      - name: Upload API documentation artifact
        uses: actions/upload-artifact@v5
        with:
          name: api-documentation
          path: docs/api/index.html
          retention-days: 90

  deploy-docs:
    name: Deploy API Docs to GitHub Pages
    needs: [generate-api-docs]
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate OpenAPI HTML documentation
        run: ./scripts/generate-docs.sh

      - name: Prepare Pages directory
        run: |
          mkdir -p _site/api
          cp docs/api/index.html _site/api/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  integration-tests:
    name: Integration Tests
    needs: [frontend-checks, backend-checks, simulator-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          docker compose -f docker-compose.ci.yml build

      - name: Start services
        run: |
          docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10

      - name: Check service health
        run: |
          echo "Checking if all containers are running..."
          docker compose -f docker-compose.ci.yml ps

          RUNNING=$(docker compose -f docker-compose.ci.yml ps --services --filter "status=running" | wc -l)
          EXPECTED=3  # backend, simulator, redis

          if [ "$RUNNING" -ne "$EXPECTED" ]; then
            echo "Error: Expected $EXPECTED containers running, but found $RUNNING"
            docker compose -f docker-compose.ci.yml logs
            exit 1
          fi

          echo "All containers are running successfully!"

      - name: Test backend API health endpoint
        run: |
          sleep 5

          for i in {1..10}; do
            if curl -f http://localhost:8000/api/healthcheck; then
              echo "Backend API health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 2
          done

          echo "Backend health check failed after 10 attempts"
          docker compose -f docker-compose.ci.yml logs backend
          exit 1

      - name: Test frontend is being served by backend
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8000/ | grep -q "<!doctype html>"; then
              echo "Frontend is being served successfully by backend!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 2
          done

          echo "Frontend check failed after 10 attempts"
          docker compose -f docker-compose.ci.yml logs backend
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Collecting container logs ==="
          docker compose -f docker-compose.ci.yml logs

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v

  build-and-push-app:
    name: Build and Push App Image
    needs: [frontend-checks, backend-checks, simulator-checks, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.ref == 'refs/heads/trunk'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/sdr-cockpit.Dockerfile
          push: false
          load: true
          tags: sdr-cockpit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and push to registry
        if: github.ref == 'refs/heads/trunk'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            docker tag sdr-cockpit:latest "$tag"
            docker push "$tag"
          done

      - name: Save image as tar for RPM build
        run: |
          docker save sdr-cockpit:latest -o /tmp/sdr-cockpit-image.tar

      - name: Upload image tar for RPM build
        uses: actions/upload-artifact@v5
        with:
          name: sdr-cockpit-image
          path: /tmp/sdr-cockpit-image.tar
          retention-days: 1

  build-and-push-simulator:
    name: Build and Push Simulator Image
    needs: [frontend-checks, backend-checks, simulator-checks, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.ref == 'refs/heads/trunk'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.ref == 'refs/heads/trunk'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-simulator
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/simulator.Dockerfile
          push: false
          load: true
          tags: sdr-cockpit-simulator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and push to registry
        if: github.ref == 'refs/heads/trunk'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            docker tag sdr-cockpit-simulator:test "$tag"
            docker push "$tag"
          done

  build-rpm:
    name: Build RPM Package
    needs: [frontend-checks, backend-checks, simulator-checks, integration-tests, build-and-push-app]
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download container image tar
        uses: actions/download-artifact@v6
        with:
          name: sdr-cockpit-image

      - name: Install dependencies
        run: |
          dnf install -y podman rpm-build

      - name: Build RPM
        run: |
          ./scripts/build-rpm-from-tar.sh sdr-cockpit-image.tar 0.1.0 1

      - name: Verify RPM contents
        run: |
          echo "=== RPM Package Info ==="
          rpm -qip sdr-cockpit*.rpm
          echo ""
          echo "=== RPM File List ==="
          rpm -qlp sdr-cockpit*.rpm

      - name: Upload RPM artifact
        if: github.ref == 'refs/heads/trunk'
        uses: actions/upload-artifact@v5
        with:
          name: sdr-cockpit-rpm
          path: sdr-cockpit*.rpm
          retention-days: 90
