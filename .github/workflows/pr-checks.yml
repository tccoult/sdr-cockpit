name: PR Checks

on:
  pull_request:
    branches:
      - trunk
    types: [opened, synchronize, reopened]

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (continue on error)
        run: npm run lint || true
        continue-on-error: true

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff (continue on error)
        run: ruff check . || true
        continue-on-error: true

      - name: Format check with black (continue on error)
        run: black --check . || true
        continue-on-error: true

      - name: Type check with mypy
        run: mypy app/

      - name: Run tests
        run: pytest -v

  simulator-checks:
    name: Simulator Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: simulator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: sdr-cockpit-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: sdr-cockpit-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simulator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/simulator.Dockerfile
          push: false
          tags: sdr-cockpit-simulator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
