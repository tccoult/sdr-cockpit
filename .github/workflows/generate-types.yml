name: Generate Types Verification

on:
  pull_request:
    paths:
      - 'api/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/generate-types.sh'
      - '.github/workflows/generate-types.yml'
  push:
    branches:
      - trunk
    paths:
      - 'api/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/generate-types.sh'
      - '.github/workflows/generate-types.yml'

jobs:
  verify-generated-types:
    name: Verify Generated Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          cd ../backend
          uv sync --frozen

      - name: Generate types
        run: ./scripts/generate-types.sh

      - name: Validate frontend types and type-check
        run: |
          cd frontend
          npm run generate:types
          npm run type-check

      - name: Verify no uncommitted changes
        run: |
          git status --short
          git diff --quiet --exit-code
