name: Test RPM Installation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rpm/**'
      - 'scripts/build-rpm.sh'
      - 'docker/sdr-cockpit.Dockerfile'
  push:
    branches:
      - trunk
    paths:
      - 'rpm/**'
      - 'scripts/build-rpm.sh'
      - 'docker/sdr-cockpit.Dockerfile'

jobs:
  build-image:
    name: Build Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: |
          docker build -f docker/sdr-cockpit.Dockerfile -t sdr-cockpit:latest .

      - name: Save container image as tar
        run: |
          docker save sdr-cockpit:latest -o sdr-cockpit-image.tar

      - name: Upload image tar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdr-cockpit-image
          path: sdr-cockpit-image.tar
          retention-days: 1

  test-rpm-install:
    name: Test RPM Installation on Alma Linux
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download container image tar
        uses: actions/download-artifact@v4
        with:
          name: sdr-cockpit-image

      - name: Install dependencies
        run: |
          dnf install -y rpm-build podman redis

      - name: Build RPM (using pre-built image)
        run: |
          # Build RPM with existing image tar (skip container build)
          BUILD_DIR="$PWD/rpmbuild"
          mkdir -p "$BUILD_DIR/SOURCES" "$BUILD_DIR/SPECS"

          # Copy pre-built image tar
          cp sdr-cockpit-image.tar "$BUILD_DIR/SOURCES/"

          # Copy systemd service and spec
          cp rpm/sdr-cockpit.service "$BUILD_DIR/SOURCES/"
          cp rpm/sdr-cockpit.spec "$BUILD_DIR/SPECS/"

          # Build RPM
          rpmbuild \
            --define "_topdir $BUILD_DIR" \
            --define "_version 0.1.0" \
            --define "_release 1" \
            -bb "$BUILD_DIR/SPECS/sdr-cockpit.spec"

          # Copy RPM to current dir
          cp "$BUILD_DIR/RPMS/noarch/"*.rpm .

      - name: Install RPM
        run: |
          dnf install -y ./sdr-cockpit*.rpm

      - name: Start Redis
        run: |
          systemctl start redis
          systemctl status redis

      - name: Start SDR Cockpit service
        run: |
          systemctl start sdr-cockpit
          sleep 10
          systemctl status sdr-cockpit

      - name: Test service is responding
        run: |
          curl -f http://localhost:8000/api/health || exit 1
          echo "Service health check passed!"

      - name: Test frontend is served
        run: |
          curl -f http://localhost:8000/ | grep -q "<!doctype html>" || exit 1
          echo "Frontend check passed!"

      - name: Check logs
        if: failure()
        run: |
          journalctl -u sdr-cockpit -n 50
